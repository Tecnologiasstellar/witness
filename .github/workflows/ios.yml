name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  content-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # An approved card with a dead URL fails the build (trust policy).
      - name: Check catalog links
        run: python3 tools/check_links.py

  core-and-build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # RevenueCatConfig.plist holds the local RevenueCat public SDK key and is
      # intentionally untracked (.gitignore). The app treats a missing config as
      # a valid state (CommerceConfiguration.load returns nil), so CI writes an
      # empty stub to satisfy the Resources build phase.
      - name: Stub untracked RevenueCat config for CI
        run: |
          if [ ! -f WitnessApp/RevenueCatConfig.plist ]; then
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0">' \
              '<dict>' \
              '  <key>apiKey</key>' \
              '  <string></string>' \
              '</dict>' \
              '</plist>' > WitnessApp/RevenueCatConfig.plist
          fi

      - name: Test WitnessCore
        run: swift test --package-path Packages/WitnessCore

      - name: Build unsigned iOS app
        run: >-
          xcodebuild
          -project Witness.xcodeproj
          -scheme Witness
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/WitnessDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build
