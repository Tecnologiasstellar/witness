name: Witness

options:
  bundleIdPrefix: com.avp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: "5.0.0"

targets:
  WitnessCore:
    type: framework
    platform: iOS
    sources:
      - path: Packages/WitnessCore/Sources/WitnessCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avp.witness.core
        PRODUCT_NAME: WitnessCore
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  Witness:
    type: application
    platform: iOS
    sources:
      - path: WitnessApp
    dependencies:
      - target: WitnessCore
      - package: RevenueCat
        product: RevenueCat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avp.witness
        PRODUCT_NAME: Witness
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Witness
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

  WitnessUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WitnessUITests
    dependencies:
      - target: Witness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avp.witness.uitests
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Witness

schemes:
  Witness:
    build:
      targets:
        Witness: all
        WitnessUITests: [test]
    test:
      targets:
        - WitnessUITests
    run:
      config: Debug
    archive:
      config: Release
