name: Witness

options:
  bundleIdPrefix: com.avp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  # Pinned exactly; upgrades are a reviewed decision, never implicit.
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    exactVersion: 5.87.0

targets:
  WitnessCore:
    type: framework
    platform: iOS
    sources:
      - path: Packages/WitnessCore/Sources/WitnessCore
        excludes:
          - "Resources/**"
      # Folder reference so the framework bundle keeps the catalog/ subdirectory,
      # matching SPM's .copy("Resources/catalog") layout.
      - path: Packages/WitnessCore/Sources/WitnessCore/Resources/catalog
        type: folder
      - path: Packages/WitnessCore/Sources/WitnessCore/Resources/fieldseason
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avp.witness.core
        PRODUCT_NAME: WitnessCore
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 2
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  Witness:
    type: application
    platform: iOS
    sources:
      - path: WitnessApp
    dependencies:
      - target: WitnessCore
      - package: RevenueCat
        product: RevenueCat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avp.witness
        PRODUCT_NAME: Witness
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 2
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Witness
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: L5R9XW45B6

  WitnessUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WitnessUITests
    dependencies:
      - target: Witness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avp.witness.uitests
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Witness

  WitnessAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WitnessAppTests
      - path: Witness.storekit
        buildPhase: resources
    dependencies:
      - target: Witness
      - sdk: StoreKitTest.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avp.witness.apptests
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Witness:
    build:
      targets:
        Witness: all
        WitnessUITests: [test]
        WitnessAppTests: [test]
    test:
      # The test plan attaches the local StoreKit configuration to the test
      # action so SKTestSession can drive the store during automated tests.
      testPlans:
        - path: Witness.xctestplan
          defaultPlan: true
    run:
      config: Debug
      # Local StoreKit products for development only. Archives and Release
      # distribution never carry a StoreKit configuration.
      storeKitConfiguration: Witness.storekit
    archive:
      config: Release
