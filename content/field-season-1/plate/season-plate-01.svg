<svg viewBox="0 0 940 1400" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <!-- Witness · Field Season One · ecosystem plate: "The Counted Few".
       Relationships, not geography. Counts quote the chapters verbatim;
       re-render via tools/render_plate.sh after any edit. -->
  <defs>
    <radialGradient id="paper" cx="50%" cy="42%" r="80%">
      <stop offset="0%" stop-color="#f9f5ec"/>
      <stop offset="72%" stop-color="#f4efe2"/>
      <stop offset="100%" stop-color="#ece4d0"/>
    </radialGradient>
  </defs>

  <rect width="940" height="1400" fill="url(#paper)"/>
  <rect x="26" y="26" width="888" height="1348" fill="none" stroke="#8a5a2b" stroke-width="1.4" opacity="0.75"/>
  <rect x="34" y="34" width="872" height="1332" fill="none" stroke="#8a5a2b" stroke-width="0.6" opacity="0.5"/>

  <!-- Title block -->
  <text x="470" y="86" text-anchor="middle" font-size="15" letter-spacing="6" fill="#8a5a2b">WITNESS · FIELD SEASON ONE · PLATE</text>
  <text x="470" y="140" text-anchor="middle" font-size="46" font-style="italic" fill="#2b2620">The Counted Few</text>
  <text x="470" y="172" text-anchor="middle" font-size="15" fill="#6d6355">eight lives, two machines, and the people who stayed</text>
  <line x1="330" y1="192" x2="610" y2="192" stroke="#8a5a2b" stroke-width="1"/>

  <!-- Machine arc: THE PRICE OF PARTS (dashed, sweeps outside the left nodes) -->
  <path d="M 258 372 C 88 520, 88 1000, 258 1148" fill="none"
        stroke="#7a4a22" stroke-width="1.6" stroke-dasharray="8 6" opacity="0.75"/>
  <!-- Machine arc: THE UNINVITED (dotted, sweeps outside the right nodes down to the axolotl) -->
  <path d="M 682 372 C 856 520, 862 1010, 668 1156 C 622 1190, 580 1216, 548 1226" fill="none"
        stroke="#5c5a35" stroke-width="1.9" stroke-dasharray="2 7" stroke-linecap="round" opacity="0.8"/>

  <!-- Machine labels -->
  <g transform="translate(78 760) rotate(-90)" text-anchor="middle">
    <text font-size="16" letter-spacing="4" fill="#7a4a22">THE PRICE OF PARTS</text>
    <text y="21" font-size="12" font-style="italic" fill="#6d6355">a belief, a price, a weapon</text>
  </g>
  <g transform="translate(884 760) rotate(90)" text-anchor="middle">
    <text font-size="16" letter-spacing="4" fill="#5c5a35">THE UNINVITED</text>
    <text y="21" font-size="12" font-style="italic" fill="#6d6355">everything we bring with us</text>
  </g>

  <!-- Center medallion -->
  <circle cx="470" cy="762" r="118" fill="#f9f5ec" stroke="#8a5a2b" stroke-width="1.6"/>
  <circle cx="472" cy="760" r="122" fill="none" stroke="#8a5a2b" stroke-width="0.7" opacity="0.55"/>
  <text x="470" y="742" text-anchor="middle" font-size="15" letter-spacing="3.5" fill="#8a5a2b">THE THIN LINE</text>
  <text x="470" y="776" text-anchor="middle" font-size="21" font-style="italic" fill="#2b2620">below it, someone</text>
  <text x="470" y="802" text-anchor="middle" font-size="21" font-style="italic" fill="#2b2620">knows every one</text>

  <!-- Spokes from medallion to each node -->
  <g stroke="#8a5a2b" stroke-width="0.8" opacity="0.4">
    <line x1="470" y1="644" x2="470" y2="478"/>
    <line x1="387" y1="678" x2="335" y2="524"/>
    <line x1="553" y1="678" x2="605" y2="524"/>
    <line x1="352" y1="762" x2="260" y2="762"/>
    <line x1="588" y1="762" x2="680" y2="762"/>
    <line x1="387" y1="846" x2="335" y2="1000"/>
    <line x1="553" y1="846" x2="605" y2="1000"/>
    <line x1="470" y1="880" x2="470" y2="1072"/>
  </g>

  <!-- Species nodes -->
  <!-- TOP: RED WOLF (neither machine) -->
  <g text-anchor="middle">
    <text x="470" y="290" font-size="11.5" font-style="italic" fill="#6d6355">its machine was neither —</text>
    <text x="470" y="307" font-size="11.5" font-style="italic" fill="#6d6355">roads, rifles, and blending · ch. 4</text>
    <circle cx="470" cy="402" r="76" fill="#fdfaf3" stroke="#2b2620" stroke-width="1.3"/>
    <circle cx="472" cy="400" r="79" fill="none" stroke="#8a5a2b" stroke-width="0.7" opacity="0.6"/>
    <text x="470" y="392" font-size="17" letter-spacing="2" fill="#2b2620">RED WOLF</text>
    <text x="470" y="415" font-size="13" font-style="italic" fill="#6d6355">roughly two dozen</text>
    <text x="470" y="432" font-size="13" font-style="italic" fill="#6d6355">known in the wild</text>
  </g>

  <!-- UPPER LEFT: VAQUITA -->
  <g text-anchor="middle">
    <circle cx="292" cy="452" r="72" fill="#fdfaf3" stroke="#2b2620" stroke-width="1.3"/>
    <circle cx="294" cy="450" r="75" fill="none" stroke="#7a4a22" stroke-width="0.7" opacity="0.6"/>
    <text x="292" y="442" font-size="17" letter-spacing="2" fill="#2b2620">VAQUITA</text>
    <text x="292" y="465" font-size="13" font-style="italic" fill="#6d6355">around ten,</text>
    <text x="292" y="482" font-size="13" font-style="italic" fill="#6d6355">in one small sea</text>
  </g>

  <!-- LEFT: JAVAN RHINO -->
  <g text-anchor="middle">
    <circle cx="186" cy="760" r="72" fill="#fdfaf3" stroke="#2b2620" stroke-width="1.3"/>
    <circle cx="188" cy="758" r="75" fill="none" stroke="#7a4a22" stroke-width="0.7" opacity="0.6"/>
    <text x="186" y="740" font-size="16" letter-spacing="1.5" fill="#2b2620">JAVAN</text>
    <text x="186" y="760" font-size="16" letter-spacing="1.5" fill="#2b2620">RHINO</text>
    <text x="186" y="783" font-size="13" font-style="italic" fill="#6d6355">50? 87–100?</text>
    <text x="186" y="800" font-size="13" font-style="italic" fill="#6d6355">one peninsula</text>
  </g>

  <!-- LOWER LEFT: AMUR LEOPARD -->
  <g text-anchor="middle">
    <circle cx="292" cy="1068" r="72" fill="#fdfaf3" stroke="#2b2620" stroke-width="1.3"/>
    <circle cx="294" cy="1066" r="75" fill="none" stroke="#7a4a22" stroke-width="0.7" opacity="0.6"/>
    <text x="292" y="1046" font-size="16" letter-spacing="1.5" fill="#2b2620">AMUR</text>
    <text x="292" y="1066" font-size="16" letter-spacing="1.5" fill="#2b2620">LEOPARD</text>
    <text x="292" y="1089" font-size="13" font-style="italic" fill="#6d6355">over two hundred,</text>
    <text x="292" y="1106" font-size="13" font-style="italic" fill="#6d6355">up from thirty</text>
  </g>

  <!-- UPPER RIGHT: KĀKĀPŌ -->
  <g text-anchor="middle">
    <circle cx="648" cy="452" r="72" fill="#fdfaf3" stroke="#2b2620" stroke-width="1.3"/>
    <circle cx="650" cy="450" r="75" fill="none" stroke="#5c5a35" stroke-width="0.7" opacity="0.6"/>
    <text x="648" y="442" font-size="17" letter-spacing="2" fill="#2b2620">KĀKĀPŌ</text>
    <text x="648" y="465" font-size="13" font-style="italic" fill="#6d6355">236 birds —</text>
    <text x="648" y="482" font-size="13" font-style="italic" fill="#6d6355">every one named</text>
  </g>

  <!-- RIGHT: ʻALALĀ -->
  <g text-anchor="middle">
    <circle cx="754" cy="760" r="72" fill="#fdfaf3" stroke="#2b2620" stroke-width="1.3"/>
    <circle cx="756" cy="758" r="75" fill="none" stroke="#5c5a35" stroke-width="0.7" opacity="0.6"/>
    <text x="754" y="748" font-size="17" letter-spacing="2" fill="#2b2620">ʻALALĀ</text>
    <text x="754" y="771" font-size="13" font-style="italic" fill="#6d6355">≈110 in care,</text>
    <text x="754" y="788" font-size="13" font-style="italic" fill="#6d6355">five flying on Maui</text>
  </g>

  <!-- LOWER RIGHT: WOLLEMI PINE -->
  <g text-anchor="middle">
    <circle cx="648" cy="1068" r="72" fill="#fdfaf3" stroke="#2b2620" stroke-width="1.3"/>
    <circle cx="650" cy="1066" r="75" fill="none" stroke="#5c5a35" stroke-width="0.7" opacity="0.6"/>
    <text x="648" y="1046" font-size="16" letter-spacing="1.5" fill="#2b2620">WOLLEMI</text>
    <text x="648" y="1066" font-size="16" letter-spacing="1.5" fill="#2b2620">PINE</text>
    <text x="648" y="1089" font-size="13" font-style="italic" fill="#6d6355">45 mature trees,</text>
    <text x="648" y="1106" font-size="13" font-style="italic" fill="#6d6355">one secret canyon</text>
  </g>

  <!-- BOTTOM: AXOLOTL -->
  <g text-anchor="middle">
    <circle cx="470" cy="1150" r="76" fill="#fdfaf3" stroke="#2b2620" stroke-width="1.3"/>
    <circle cx="472" cy="1148" r="79" fill="none" stroke="#5c5a35" stroke-width="0.7" opacity="0.6"/>
    <text x="470" y="1140" font-size="17" letter-spacing="2" fill="#2b2620">AXOLOTL</text>
    <text x="470" y="1163" font-size="13" font-style="italic" fill="#6d6355">count unknown —</text>
    <text x="470" y="1180" font-size="13" font-style="italic" fill="#6d6355">found by DNA in water</text>
  </g>

  <!-- Menders band -->
  <line x1="120" y1="1272" x2="820" y2="1272" stroke="#8a5a2b" stroke-width="1"/>
  <text x="470" y="1300" text-anchor="middle" font-size="14" letter-spacing="4" fill="#8a5a2b">THE MENDERS</text>
  <text x="470" y="1323" text-anchor="middle" font-size="13" font-style="italic" fill="#2b2620">nets pulled · birds named · refuges filtered · edges defended · boots cleaned · beliefs unmade</text>
  <text x="470" y="1352" text-anchor="middle" font-size="11" fill="#6d6355">counts as told and sourced in each chapter · verified 2026-08-27 · drawn for the Witness atlas</text>
</svg>
